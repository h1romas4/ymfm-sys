name: Build-Release

on:
  workflow_call:
    inputs:
      release:
        description: "release"
        type: boolean
        required: true

env:
  RUST_TOOLCHAIN: 1.97.1
  WASI_SDK_VERSION: 33

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 (x86_64-unknown-linux-gnu)
          - name: ubuntu-26.04
            os: ubuntu-26.04
            cargo_args: ""
            wasi: false
          # Ubuntu 26.04 (wasm32-wasip1)
          - name: ubuntu-26.04-wasm32-wasip1
            os: ubuntu-26.04
            cargo_args: "--target wasm32-wasip1"
            wasi: true
          # Windows Server 2025 (x86_64-pc-windows-msvc)
          - name: windows-2025
            os: windows-2025
            cargo_args: ""
            wasi: false
          # macOS Sequoia 15 (aarch64-apple-darwin)
          - name: macos-15
            os: macos-15
            cargo_args: ""
            wasi: false
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        id: cache-toolchaine
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust Toolchain Setup
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: WASI Rust Target Setup
        if: matrix.wasi
        shell: bash
        run: rustup target add wasm32-wasip1 --toolchain ${{ env.RUST_TOOLCHAIN }}

      - name: WASI SDK Cache
        if: matrix.wasi
        uses: actions/cache@v5
        id: wasi-sdk-cache
        with:
          path: wasi-sdk-${{ env.WASI_SDK_VERSION }}
          key: ${{ runner.os }}-wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux

      - name: WASI SDK Setup
        if: matrix.wasi && runner.os == 'Linux'
        run: |
          wasi_sdk="$GITHUB_WORKSPACE/wasi-sdk-${WASI_SDK_VERSION}"
          if [ ! -d "$wasi_sdk" ]; then
            archive="$RUNNER_TEMP/wasi-sdk.tar.gz"
            # TODO: select the wasi-sdk archive name from the runner OS.
            # Only x86_64-linux is supported here for now.
            curl --fail --location --silent --show-error \
              --output "$archive" \
              "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            extracted_dir=$(tar -tzf "$archive" | head -1 | cut -d/ -f1)
            mv "$RUNNER_TEMP/$extracted_dir" "$wasi_sdk"
          fi
          echo "WASI_SDK=$wasi_sdk" >> "$GITHUB_ENV"
          echo "CXX_wasm32_wasip1=$wasi_sdk/bin/clang++" >> "$GITHUB_ENV"
          echo "CXXFLAGS_wasm32_wasip1=--target=wasm32-wasip1 --sysroot=$wasi_sdk/share/wasi-sysroot -fno-exceptions" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_WASM32_WASIP1_LINKER=$wasi_sdk/bin/clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS=-C link-arg=--sysroot=$wasi_sdk/share/wasi-sysroot -C link-arg=-lc++ -C link-arg=-lc++abi" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        if: matrix.wasi == false
        run: cargo test --all-targets

      - name: Test (rustdoc)
        if: matrix.wasi == false
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy ${{ matrix.cargo_args }} --all-targets --all-features -- -D warnings

      - name: Compile
        run: cargo build --release --all-targets ${{ matrix.cargo_args }}

      - name: Verify vgmrender (Unix)
        if: runner.os != 'Windows' && matrix.wasi == false
        run: |
          test -f target/release/examples/vgmrender
          ls -l target/release/examples/vgmrender

      - name: Verify vgmrender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target/release/examples/vgmrender.exe"
          if (-not (Test-Path -Path $path -PathType Leaf)) {
            throw "Expected example executable was not found: $path"
          }
          Get-Item $path | Select-Object FullName, Length, LastWriteTime
