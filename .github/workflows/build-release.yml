name: Build-Release

on:
  workflow_call:
    inputs:
      release:
        description: "release"
        type: boolean
        required: true

env:
  RUST_TOOLCHAIN: 1.97.1

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 (x86_64-unknown-linux-gnu)
          - os: ubuntu-26.04
          # Windows Server 2025 (x86_64-pc-windows-msvc)
          - os: windows-2025
          # macOS Sequoia 15 (aarch64-apple-darwin)
          - os: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        id: cache-toolchaine
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust Toolchain Setup
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --no-self-update
          rustup component add rustfmt clippy --toolchain ${{ env.RUST_TOOLCHAIN }}
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --all-targets

      - name: Test (rustdoc)
        run: cargo test --doc

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile
        run: cargo build --release --all-targets

      - name: Verify vgmrender (Unix)
        if: runner.os != 'Windows'
        run: |
          test -f target/release/examples/vgmrender
          ls -l target/release/examples/vgmrender

      - name: Verify vgmrender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "target/release/examples/vgmrender.exe"
          if (-not (Test-Path -Path $path -PathType Leaf)) {
            throw "Expected example executable was not found: $path"
          }
          Get-Item $path | Select-Object FullName, Length, LastWriteTime
